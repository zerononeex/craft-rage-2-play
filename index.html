<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Craft Rage 2">
<meta name="theme-color" content="#000000">
<title>Craft Rage 2</title>
<!-- bible rule 8: these icon tags must survive every rebuild (tools/build.js checks) -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { position: fixed; inset: 0; }
  /* one fit rule for every screen: the whole game is letterboxed inside the visible area (safe areas + Safari chrome),
     never cropped; main.js re-fits whenever the visible viewport changes */
  #game { position: absolute; top: env(safe-area-inset-top); right: env(safe-area-inset-right); bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left); overflow: hidden; }
  #turn { display: none; position: fixed; inset: 0; z-index: 10; background: #111; color: #fff; font: bold 28px "Courier New", monospace;
    align-items: center; justify-content: center; text-align: center; padding: 20px; }
  @media (orientation: portrait) and (pointer: coarse) { #turn { display: flex; } }
  #join-form { position: fixed; left: 50%; top: 52%; transform: translate(-50%, -50%); z-index: 5; display: flex; gap: 12px; }
  #join-form input { width: 5.2em; font: bold 44px "Courier New", monospace; text-align: center; text-transform: uppercase; letter-spacing: 0.15em;
    border: 4px solid #fff; border-radius: 12px; background: #222; color: #ffe04a; padding: 6px; }
  #join-form button { font: bold 30px "Courier New", monospace; border: 4px solid #fff; border-radius: 12px; background: #3a7d2a; color: #fff; padding: 0 20px; }
  #code-panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5; width: min(80vw, 640px); background: #0a0810; border: 3px solid #ff7a30;
    padding: 14px 18px; color: #e8e0d0; font: bold 18px "Courier New", monospace; text-align: center; -webkit-user-select: text; user-select: text; }
  #code-panel p { margin: 4px 0 10px; }
  #code-panel textarea { width: 100%; box-sizing: border-box; height: 5.5em; font: bold 16px "Courier New", monospace; background: #222; color: #ffe04a; border: 2px solid #fff;
    border-radius: 8px; padding: 8px; word-break: break-all; -webkit-user-select: text; user-select: text; }
  #code-panel div { display: flex; gap: 14px; justify-content: center; margin-top: 12px; }
  #code-panel button { font: bold 22px "Courier New", monospace; border: 3px solid #fff; border-radius: 10px; background: #3a7d2a; color: #fff; padding: 6px 22px; }
  #code-panel button[type=button] { background: #6b4a2a; }
  #code-panel .msg { color: #7fd0ff; min-height: 1.2em; margin-top: 10px; }
</style>
</head>
<body>
<div id="game"></div>
<div id="turn">Turn your iPad sideways to play!</div>
<script src="assets/manifest.js"></script>
<script src="game.js"></script>
</body>
</html>
